name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]
  workflow_call:    # allows deploy.yml to call this as a gate

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — unit tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Enforce generated SEO assets are committed
        run: |
          git diff --exit-code -- public/sitemap.xml public/robots.txt public/llms.txt public/llms-full.txt public/ai.txt

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    name: Backend — seed, smoke tests & API checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      PORT: 3001
      TEST_API_BASE: http://127.0.0.1:3001
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_NS: wcs_ci
      OPEN_LIBRARY_BASE: https://openlibrary.org
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 1h

    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Seed database
        run: npm run seed

      - name: Start server and run API smoke tests
        run: |
          npm run dev &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health; then
              echo "Server is up"
              break
            fi
            sleep 1
          done
          npm test
          curl -sf http://localhost:3001/api/v1/platform | grep -q "World Class Scholars"
          curl -sf "http://localhost:3001/api/v1/library/search?q=care&source=internal" | grep -q "internal"
          curl -sf http://localhost:3001/api/v1/commerce/beta-manifest | grep -q "wcs-ios-beta-manifest"
          curl -sf http://localhost:3001/api/v1/contact | grep -q "support@myworldclass.org"
